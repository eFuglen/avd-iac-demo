# Azure Virtual Desktop Infrastructure as Code Deployment Pipeline

trigger:
- main

pool:
  vmImage: 'windows-latest'

variables:
  resourceGroup: 'rg-avd-prod'
  location: 'denmarkeast'
  azureSubscription: '3krCloud Sub DevOps'

steps:
- task: AzureCLI@2
  displayName: 'Deploy AVD Infrastructure'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'pscore'
    scriptLocation: 'scriptPath'
    scriptPath: '$(System.DefaultWorkingDirectory)/scripts/Deploy-AVD.ps1'
    arguments: '-ResourceGroup $(resourceGroup) -Location $(location) -ParameterFile "$(System.DefaultWorkingDirectory)/parameters/main.bicepparam" -WhatIf'
    addSpnToEnvironment: true
    workingDirectory: '$(System.DefaultWorkingDirectory)'
  env:
    ADMIN_PASSWORD: $(vmAdminPassword)  # Store as secret variable in pipeline


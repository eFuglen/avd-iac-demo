# Azure Virtual Desktop Infrastructure as Code Deployment Pipeline

trigger:
  - main

pool:
  vmImage: "windows-latest"

variables:
  - name: resourceGroup
    value: "rg-avd-prod"
  - name: location
    value: "denmarkeast"
  - name: azureSubscription
    value: "3krCloud Sub DevOps"
  - group: "AVD-Params-and-Secrets"

stages:
  - stage: Validate
    displayName: "Validate Deployment"
    jobs:
      - job: WhatIfDeployment
        displayName: "Run What-If Deployment"
        steps:
          - task: AzureCLI@2
            displayName: "Deploy AVD Infrastructure"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(System.DefaultWorkingDirectory)/scripts/Deploy-AVD.ps1"
              arguments: '-ResourceGroup $(resourceGroup) -Location $(location) -ParameterFile "$(System.DefaultWorkingDirectory)/parameters/main.bicepparam" -WhatIf'
              addSpnToEnvironment: true
              workingDirectory: "$(System.DefaultWorkingDirectory)"
            env:
              ADMIN_PASSWORD: $(vmAdminPassword)

  - stage: Deploy
    displayName: "Deploy to Production"
    dependsOn: Validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: ActualDeployment
        displayName: "Run Actual Deployment"
        steps:
          - task: AzureCLI@2
            displayName: "Deploy AVD Infrastructure"
            inputs:
              azureSubscription: "$(azureSubscription)"
              scriptType: "pscore"
              scriptLocation: "scriptPath"
              scriptPath: "$(System.DefaultWorkingDirectory)/scripts/Deploy-AVD.ps1"
              arguments: '-ResourceGroup $(resourceGroup) -Location $(location) -ParameterFile "$(System.DefaultWorkingDirectory)/parameters/main.bicepparam"'
              addSpnToEnvironment: true
              workingDirectory: "$(System.DefaultWorkingDirectory)"
            env:
              ADMIN_PASSWORD: $(vmAdminPassword)
